[project]
name = "auto-hr"
version = "0.1.0"
description = ""
authors = [
    {name = "QuangNguyen2609",email = "quangnguyentechno@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "langgraph>=0.2.6",
    "langchain-openai>=0.1.22",
    "langchain-anthropic>=0.1.23",
    "langchain>=0.2.14",
    "langchain-fireworks>=0.1.7",
    "python-dotenv>=1.0.1",
    "langchain-tavily>=0.1",
    "langgraph-cli[inmem]>=0.1.71",
    "pytest>=8.3.5",
    "json-repair (>=0.44.1,<0.45.0)",
    "langchain-mcp-adapters (>=0.1.0,<0.2.0)",
    "readabilipy (>=0.3.0,<0.4.0)",
    "pypdf (>=5.6.0,<6.0.0)",
    "supabase (>=2.15.3,<3.0.0)",
    "asyncio (>=3.4.3,<4.0.0)",
    "numpy (>=2.3.0,<3.0.0)",
    "pymupdf (>=1.26.1,<2.0.0)"
]

[tool.poetry]
packages = [{include = "auto_hr", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
